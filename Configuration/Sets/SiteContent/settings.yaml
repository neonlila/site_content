styles:
  templates:
    layoutRootPath: 'EXT:site_content/Resources/Private/ContentElements/Layouts/'
    partialRootPath: 'EXT:site_content/Resources/Private/ContentElements/Partials/'
    templateRootPath: 'EXT:site_content/Resources/Private/ContentElements/Templates/'

page:
  
  meta:
    viewport: 'width=device-width, initial-scale=1'
    robots: 'index,follow'
    apple-mobile-web-app-capable: 'no'
    compatible: 'IE=edge'

config:
  no_cache: '0'
  removeDefaultJS: '0'
  admPanel: '0'
  prefixLocalAnchors: 'all'
  headerComment: 'build by kristina wiemann'
  sendCacheHeaders: '1'
